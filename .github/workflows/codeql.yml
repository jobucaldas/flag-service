name: CodeQL

on:
  pull_request:
    branches: [main, t3]
  push:
    branches: [main, t3]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: python

      - uses: github/codeql-action/analyze@v4.37.9
        with:
          category: /language:python
